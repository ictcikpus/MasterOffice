<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leaderboard Siswa</title>

    <!-- Tailwind CSS (via CDN karena kode JS menggunakan class Tailwind) -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- FontAwesome (via CDN untuk icon trophy, medal, award) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
</head>
<body class="bg-slate-950 text-slate-200 font-sans antialiased min-h-screen flex items-center justify-center p-4">

    <!-- Kontainer Utama Card Leaderboard -->
    <div class="w-full max-w-md bg-slate-800/30 border border-slate-700/50 rounded-2xl shadow-2xl backdrop-blur-sm overflow-hidden">
        
        <!-- Header -->
        <div class="bg-slate-900/50 p-5 border-b border-slate-700/50 flex items-center justify-between">
            <div>
                <h2 class="text-lg font-bold text-slate-100 flex items-center gap-2">
                    <i class="fa-solid fa-ranking-star text-sky-400"></i>
                    Peringkat Siswa
                </h2>
                <p class="text-xs text-slate-400 mt-1">Top 10 Skor Tertinggi</p>
            </div>
        </div>

        <!-- Area Render dari leaderboard.js -->
        <!-- Ditambahkan class flex-col dan gap-2 agar item memiliki jarak yang rapi -->
        <div id="leaderboard-list" class="p-4 flex flex-col gap-2 min-h-[200px] max-h-[600px] overflow-y-auto">
            <!-- Tampilan Loading sementara sebelum Firebase merespon -->
            <p class="text-center text-slate-500 py-6 text-sm animate-pulse">Memuat papan peringkat...</p>
        </div>

    </div>

    <!-- Firebase SDK (Gunakan versi Compat untuk sintaks db.ref() di kodemu) -->
    <script src="https://www.gstatic.com/firebasejs/10.5.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.5.0/firebase-database-compat.js"></script>

    <script>
        // 1. Konfigurasi Firebase (Isi dengan config dari project Firebase-mu)
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
            databaseURL: "https://YOUR_PROJECT_ID-default-rtdb.firebaseio.com",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_PROJECT_ID.appspot.com",
            messagingSenderId: "YOUR_SENDER_ID",
            appId: "YOUR_APP_ID"
        };
        
        // Inisialisasi Firebase
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // 2. Deklarasi userId 
        // Variabel ini wajib ada karena di leaderboard.js kamu memanggil: player.id === userId
        // (Biasanya didapatkan dari Firebase Auth currentUser.uid)
        let userId = "contoh_id_user_aktif"; 
    </script>

    <!-- Hubungkan file JS kamu di sini -->
    <script src="leaderboard.js"></script>

</body>
</html>
