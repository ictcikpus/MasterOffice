<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Petualangan Belajar Office</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>
<body>
    <div class="game-container">
        <header>
            <h1 class="bounce-in">🎮 Petualangan Office! 🚀</h1>
            <p>Pilih pulau materi di bawah ini sebelum melawan monster ujian!</p>
        </header>

        <!-- Peta Menu Utama -->
        <div id="main-menu" class="menu-grid">
            <!-- Tombol digenerate dari JavaScript -->
        </div>

        <!-- Area Bacaan Materi -->
        <div id="content-area" class="hidden">
            <button id="btn-back" class="btn-action btn-back" onmouseenter="playSound('hover')" onclick="goBack()">🔙 Kembali ke Peta</button>
            
            <div id="materi-display" class="materi-card">
                <h2 id="materi-title">Judul</h2>
                <div id="materi-text" class="materi-content"></div>
                <button id="btn-finish" class="btn-action pulse" onmouseenter="playSound('hover')" onclick="finishReading()">🌟 Aku Siap Kuis!</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
