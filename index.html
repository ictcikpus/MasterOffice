<!DOCTYPE1 html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Edukasi & Leaderboard Live</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-900 text-white min-h-screen font-sans">

    <!-- Header / Navbar -->
    <header class="bg-slate-800 border-b border-slate-700 py-4 px-6 mb-8 sticky top-0 z-50 shadow-lg">
        <div class="max-w-6xl mx-auto flex justify-between items-center">
            <h1 class="text-xl md:text-2xl font-bold text-amber-400 flex items-center gap-2">
                <i class="fa-solid fa-gamepad"></i> Game Edukasi Siswa
            </h1>
            <div id="user-badge" class="bg-slate-700 px-4 py-2 rounded-full text-sm font-semibold flex items-center gap-2">
                <i class="fa-solid fa-user text-sky-400"></i>
                <span id="player-name">Siswa</span>
            </div>
        </div>
    </header>

    <main class="max-w-6xl mx-auto px-4 pb-12 grid grid-cols-1 lg:grid-cols-3 gap-8">
        
        <!-- Kolom 1 & 2: Area Permainan & Skor Saya -->
        <div class="lg:col-span-2 space-y-6">
            <!-- Card Profil & Skor Siswa -->
            <div class="bg-slate-800 border border-slate-700 rounded-2xl p-6 shadow-xl relative overflow-hidden">
                <div class="absolute -right-10 -bottom-10 opacity-10 text-9xl text-sky-400">
                    <i class="fa-solid fa-trophy"></i>
                </div>
                <h2 class="text-slate-400 text-sm font-medium uppercase tracking-wider mb-2">Poin Kamu Saat Ini</h2>
                <div class="flex items-baseline gap-2">
                    <span id="my-score" class="text-5xl font-extrabold text-sky-400 tracking-tight">0</span>
                    <span class="text-slate-400 font-semibold">Poin</span>
                </div>
            </div>

            <!-- Card Area Game (Simulasi Game) -->
            <div class="bg-slate-800 border border-slate-700 rounded-2xl p-6 shadow-xl text-center space-y-4">
                <h3 class="text-lg font-bold text-slate-200">Kuis & Tantangan Interaktif</h3>
                <p class="text-slate-400 text-sm">Klik tombol di bawah untuk menyelesakan soal/tantangan dan dapatkan poin!</p>
                
                <div class="py-8 bg-slate-900/50 rounded-xl border border-slate-700/50 flex flex-col items-center justify-center gap-4">
                    <button onclick="addPoints(10)" class="w-full max-w-xs bg-emerald-500 hover:bg-emerald-600 active:scale-95 transition-all text-slate-900 font-bold py-3 px-6 rounded-xl shadow-lg flex items-center justify-center gap-2">
                        <i class="fa-solid fa-circle-check"></i> Jawab Benar (+10 Poin)
                    </button>
                    <button onclick="addPoints(50)" class="w-full max-w-xs bg-amber-500 hover:bg-amber-600 active:scale-95 transition-all text-slate-900 font-bold py-3 px-6 rounded-xl shadow-lg flex items-center justify-center gap-2">
                        <i class="fa-solid fa-bolt"></i> Bonus Kombinasi (+50 Poin)
                    </button>
                </div>
            </div>
        </div>

        <!-- Kolom 3: Leaderboard 10 Besar -->
        <div class="bg-slate-800 border border-slate-700 rounded-2xl p-6 shadow-xl h-fit">
            <div class="flex items-center justify-between border-b border-slate-700 pb-4 mb-4">
                <h2 class="text-lg font-bold text-amber-400 flex items-center gap-2">
                    <i class="fa-solid fa-crown text-amber-400"></i> Top 10 Poin Tertinggi
                </h2>
                <span class="text-xs bg-amber-500/10 text-amber-400 px-2.5 py-1 rounded-full font-medium">Live Sync</span>
            </div>

            <!-- List Top 10 -->
            <div id="leaderboard-list" class="space-y-3">
                <!-- Item Leaderboard (Diisi secara dinamis oleh JavaScript) -->
                <div class="text-center text-slate-500 py-6">Memuat peringkat...</div>
            </div>
        </div>

    </main>

    <!-- Firebase SDK (v9 Modul kompatibilitas) -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

    <script>
        // 1. Konfigurasi Firebase Realtime Database
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
            databaseURL: "https://YOUR_PROJECT_ID-default-rtdb.firebaseio.com",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_PROJECT_ID.appspot.com",
            messagingSenderId: "YOUR_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        // Inisialisasi Firebase
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // 2. Simulasi Identitas Siswa
        let userId = localStorage.getItem("student_id");
        let userName = localStorage.getItem("student_name");

        if (!userId) {
            userId = "user_" + Math.random().toString(36).substr(2, 9);
            userName = prompt("Masukkan Nama Lengkap Anda:") || "Siswa " + Math.floor(Math.random() * 100);
            localStorage.setItem("student_id", userId);
            localStorage.setItem("student_name", userName);
        }

        document.getElementById("player-name").innerText = userName;

        let currentScore = 0;
        const userRef = db.ref('leaderboard/' + userId);

        // Listen perubahan poin siswa aktif secara Real-time
        userRef.on('value', (snapshot) => {
            const data = snapshot.val();
            if (data) {
                currentScore = data.score || 0;
            } else {
                // Set data awal jika belum ada
                userRef.set({ name: userName, score: 0 });
            }
            document.getElementById("my-score").innerText = currentScore;
        });

        // 3. Fungsi Menambah Poin saat Permainan Berjalan
        function addPoints(amount) {
            currentScore += amount;
            userRef.update({
                name: userName,
                score: currentScore,
                updatedAt: firebase.database.ServerValue.TIMESTAMP
            });
        }

        // 4. Listen Papan Peringkat 10 Besar (Top 10)
        const leaderboardRef = db.ref('leaderboard').orderByChild('score').limitToLast(10);

        leaderboardRef.on('value', (snapshot) => {
            const listElement = document.getElementById("leaderboard-list");
            listElement.innerHTML = "";

            let players = [];
            snapshot.forEach((childSnapshot) => {
                players.push({
                    id: childSnapshot.key,
                    ...childSnapshot.val()
                });
            });

            // Urutkan dari poin tertinggi ke terendah
            players.reverse();

            if (players.length === 0) {
                listElement.innerHTML = `<p class="text-center text-slate-500 py-4">Belum ada data skor.</p>`;
                return;
            }

            players.forEach((player, index) => {
                const rank = index + 1;
                const isCurrentUser = player.id === userId;

                // Style khusus untuk Juara 1, 2, 3
                let rankBadge = `<span class="w-6 text-center font-bold text-slate-400">${rank}</span>`;
                if (rank === 1) rankBadge = `<span class="w-6 text-center text-amber-400 font-bold"><i class="fa-solid fa-trophy"></i></span>`;
                if (rank === 2) rankBadge = `<span class="w-6 text-center text-slate-300 font-bold"><i class="fa-solid fa-medal"></i></span>`;
                if (rank === 3) rankBadge = `<span class="w-6 text-center text-amber-600 font-bold"><i class="fa-solid fa-award"></i></span>`;

                const itemHTML = `
                    <div class="flex items-center justify-between p-3 rounded-xl transition-all ${isCurrentUser ? 'bg-sky-500/20 border border-sky-500/50' : 'bg-slate-700/50'}">
                        <div class="flex items-center gap-3">
                            ${rankBadge}
                            <span class="font-medium text-sm text-slate-200 ${isCurrentUser ? 'font-bold text-sky-400' : ''}">
                                ${player.name} ${isCurrentUser ? '(Kamu)' : ''}
                            </span>
                        </div>
                        <span class="font-extrabold text-amber-400 text-sm">${player.score} <span class="text-xs text-slate-400 font-normal">pt</span></span>
                    </div>
                `;
                listElement.innerHTML += itemHTML;
            });
        });
    </script>
</body>
</html>
