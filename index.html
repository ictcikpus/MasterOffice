<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Office Pro-Quest | E-Learning System</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>
<body>
    <!-- Background Elements -->
    <div class="bg-grid"></div>
    <div class="glow-orb orb-1"></div>
    <div class="glow-orb orb-2"></div>

    <div class="game-wrapper">
        
        <!-- SECTION: LOGIN / REGISTRATION -->
        <section id="login-section" class="active-screen slide-in">
            <div class="panel login-panel">
                <div class="logo-container">
                    <svg class="sys-icon" viewBox="0 0 24 24"><path fill="currentColor" d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
                    <h1>OFFICE PRO-QUEST</h1>
                    <p>Sistem Ujian Terpadu v2.0</p>
                </div>
                
                <div class="form-group">
                    <label>NAMA AGEN / SISWA</label>
                    <input type="text" id="player-name" placeholder="Masukkan nama Anda..." autocomplete="off">
                </div>
                <div class="form-group">
                    <label>KELAS / KODE DIVISI</label>
                    <input type="text" id="player-class" placeholder="Contoh: X-RPL 1" autocomplete="off">
                </div>
                
                <button class="btn btn-primary" id="btn-login">Inisiasi Sistem 🚀</button>
            </div>
        </section>

        <!-- SECTION: DASHBOARD / LEVEL SELECT -->
        <section id="dashboard-section" class="hidden-screen">
            <header class="dashboard-header">
                <div class="user-info">
                    <div class="avatar"><svg viewBox="0 0 24 24"><path fill="currentColor" d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg></div>
                    <div>
                        <h3 id="display-name">NAMA</h3>
                        <p id="display-class" class="text-muted">KELAS</p>
                    </div>
                </div>
                <div class="sys-status">STATUS: <span class="text-green">ONLINE</span></div>
            </header>

            <div class="panel">
                <h2 class="section-title">Pilih Modul Pembelajaran</h2>
                <div id="level-grid" class="level-grid">
                    <!-- Levels generated here -->
                </div>
            </div>
        </section>

        <!-- SECTION: MATERI READER -->
        <section id="materi-section" class="hidden-screen">
            <div class="panel materi-panel">
                <button class="btn btn-secondary btn-back" id="btn-back-materi">⮜ KEMBALI</button>
                <div class="materi-header" id="materi-header-ui">
                    <svg class="materi-icon" id="materi-icon-svg" viewBox="0 0 24 24"><path fill="currentColor" id="materi-icon-path" d=""/></svg>
                    <h2 id="materi-title">Judul Modul</h2>
                </div>
                <div class="materi-content-box" id="materi-content">
                    <!-- Content -->
                </div>
                <button class="btn btn-primary btn-full pulse-glow" id="btn-start-quiz">MULAI UJIAN MODUL INI ⚔️</button>
            </div>
        </section>

        <!-- SECTION: QUIZ -->
        <section id="quiz-section" class="hidden-screen">
            <div class="panel quiz-panel">
                <div class="quiz-header">
                    <div class="quiz-progress">Pertanyaan <span id="q-current">1</span> / <span id="q-total">20</span></div>
                    <div class="quiz-timer">⏱ <span id="timer">00:00</span></div>
                </div>
                
                <div class="question-box">
                    <h3 id="question-text">Pertanyaan akan muncul di sini?</h3>
                </div>
                
                <div class="options-grid" id="options-container">
                    <!-- Options -->
                </div>
            </div>
        </section>

        <!-- SECTION: RESULT -->
        <section id="result-section" class="hidden-screen">
            <div class="panel text-center">
                <h1 class="result-title">EVALUASI SELESAI</h1>
                <div class="score-circle">
                    <span id="final-score">100</span>
                </div>
                <h3 id="result-rank" class="rank-text">RANK: S</h3>
                <p id="result-message" class="text-muted mt-2">Pencapaian yang luar biasa!</p>
                <div class="action-buttons mt-4">
                    <button class="btn btn-primary" id="btn-back-home">KEMBALI KE DASHBOARD</button>
                </div>
            </div>
        </section>

    </div>

    <script src="script.js"></script>
</body>
</html>
